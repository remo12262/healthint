services:
  - type: web
    name: healthint-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REFRESH_KEY
        sync: false
      - key: MAX_DAILY_AI_CALLS
        value: "100"
      - key: RATE_LIMIT_PER_HOUR
        value: "10"

  - type: web
    name: healthint-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
